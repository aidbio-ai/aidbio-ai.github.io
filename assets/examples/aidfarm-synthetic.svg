<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
<title id="title">Synthetic AidFarm biomass fixture, raw plot-level values</title>
<desc id="desc">Four synthetic plot values in each of Control, Treatment A, and Treatment B. These are demonstration data, not a real trial or a treatment-effect estimate.</desc>
<rect width="960" height="520" rx="24" fill="#fbfcfe"/>
<text x="70" y="53" fill="#163bb5" font-family="Arial,sans-serif" font-size="27" font-weight="700">Field observations, with every plot visible</text>
<text x="70" y="85" fill="#52627a" font-family="Arial,sans-serif" font-size="17">Synthetic demonstration data · 12 invented plot-level records</text>
<text x="37" y="270" transform="rotate(-90 37 270)" fill="#52627a" font-family="Arial,sans-serif" font-size="17">Harvested biomass (kg per plot)</text>
<g font-family="Arial,sans-serif"><line x1="95" y1="410" x2="850" y2="410" stroke="#dce5f1"/><text x="78" y="415" text-anchor="end" fill="#53647a" font-size="16">38</text><line x1="95" y1="360" x2="850" y2="360" stroke="#dce5f1"/><text x="78" y="365" text-anchor="end" fill="#53647a" font-size="16">40</text><line x1="95" y1="310" x2="850" y2="310" stroke="#dce5f1"/><text x="78" y="315" text-anchor="end" fill="#53647a" font-size="16">42</text><line x1="95" y1="260" x2="850" y2="260" stroke="#dce5f1"/><text x="78" y="265" text-anchor="end" fill="#53647a" font-size="16">44</text><line x1="95" y1="210" x2="850" y2="210" stroke="#dce5f1"/><text x="78" y="215" text-anchor="end" fill="#53647a" font-size="16">46</text><line x1="95" y1="160" x2="850" y2="160" stroke="#dce5f1"/><text x="78" y="165" text-anchor="end" fill="#53647a" font-size="16">48</text><line x1="95" y1="110" x2="850" y2="110" stroke="#dce5f1"/><text x="78" y="115" text-anchor="end" fill="#53647a" font-size="16">50</text><text x="220" y="458" text-anchor="middle" fill="#24354e" font-size="18" font-weight="700">Control</text><circle cx="187" cy="330.0" r="10" fill="#0B45FA" opacity=".82"><title>P01: 41.2 kg</title></circle><circle cx="209" cy="365.0" r="10" fill="#0B45FA" opacity=".82"><title>P04: 39.8 kg</title></circle><circle cx="231" cy="297.5" r="10" fill="#0B45FA" opacity=".82"><title>P07: 42.5 kg</title></circle><circle cx="253" cy="345.0" r="10" fill="#0B45FA" opacity=".82"><title>P11: 40.6 kg</title></circle><text x="470" y="458" text-anchor="middle" fill="#24354e" font-size="18" font-weight="700">Treatment A</text><circle cx="437" cy="187.5" r="10" fill="#F2542D" opacity=".82"><title>P02: 46.9 kg</title></circle><circle cx="459" cy="165.0" r="10" fill="#F2542D" opacity=".82"><title>P06: 47.8 kg</title></circle><circle cx="481" cy="220.0" r="10" fill="#F2542D" opacity=".82"><title>P08: 45.6 kg</title></circle><circle cx="503" cy="152.5" r="10" fill="#F2542D" opacity=".82"><title>P12: 48.3 kg</title></circle><text x="720" y="458" text-anchor="middle" fill="#24354e" font-size="18" font-weight="700">Treatment B</text><circle cx="687" cy="285.0" r="10" fill="#F59E0B" opacity=".82"><title>P03: 43.0 kg</title></circle><circle cx="709" cy="257.5" r="10" fill="#F59E0B" opacity=".82"><title>P05: 44.1 kg</title></circle><circle cx="731" cy="305.0" r="10" fill="#F59E0B" opacity=".82"><title>P09: 42.2 kg</title></circle><circle cx="753" cy="242.5" r="10" fill="#F59E0B" opacity=".82"><title>P10: 44.7 kg</title></circle></g>
<line x1="95" y1="410" x2="850" y2="410" stroke="#71839b" stroke-width="2"/>
<text x="70" y="497" fill="#52627a" font-family="Arial,sans-serif" font-size="15">Illustrates how individual observations remain inspectable. No agronomic conclusion.</text>
</svg>
