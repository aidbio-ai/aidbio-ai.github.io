<g transform="translate(80,40)">
<line class="l" x1="160" y1="120" x2="320" y2="70"/><line class="l" x1="160" y1="120" x2="300" y2="210"/><line class="l" x1="320" y1="70" x2="440" y2="160"/><line class="l" x1="300" y1="210" x2="440" y2="160"/><line class="l" x1="300" y1="210" x2="420" y2="300"/><line class="l" x1="440" y1="160" x2="560" y2="260"/>
