<svg viewBox="0 0 980 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
<title id="t">From metabolic signals to gene regulation</title><desc id="d">A schematic adapted from Matiolli et al. 2011 showing glucose and ABA converging on bZIP63 and downstream transcription.</desc>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#536274"/></marker></defs>
<style>.n{fill:#fff;stroke:#d9e0e9;stroke-width:2}.tx{font:600 20px system-ui;fill:#202735}.sm{font:14px system-ui;fill:#64748b}.ln{stroke:#536274;stroke-width:3;fill:none;marker-end:url(#a)}</style>
<rect class="n" x="45" y="120" rx="22" width="180" height="90"/><text class="tx" x="135" y="160" text-anchor="middle">Glucose</text><text class="sm" x="135" y="186" text-anchor="middle">energy status</text>
<rect class="n" x="45" y="250" rx="22" width="180" height="90"/><text class="tx" x="135" y="290" text-anchor="middle">ABA</text><text class="sm" x="135" y="316" text-anchor="middle">stress hormone</text>
